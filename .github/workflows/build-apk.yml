name: Build & Test Ayaan Islamic Studio APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests & Build Debug APK
        env:
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          UNITY_GAME_ID: ${{ secrets.UNITY_GAME_ID }}
          AI_PROXY_BASE_URL: https://us-central1-ryaan-islamic-studio.cloudfunctions.net/aiScholarProxy
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayaan-Islamic-Studio-v1.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk

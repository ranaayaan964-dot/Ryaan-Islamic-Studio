name: Build Debug APK

on:
push:
branches:
- main
workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  # 1. Get the code from the repository
  - name: Checkout repository
    uses: actions/checkout@v4

  # 2. Set up Java 17 (Standard for modern Android development)
  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'
      cache: gradle

  # 3. Fix permissions for Gradle Wrapper (Crucial step)
  - name: Grant execute permission for gradlew
    run: chmod +x gradlew

  # 4. Setup Gradle Environment
  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  # 5. Build the Debug APK using Gradle Wrapper
  - name: Build Debug APK
    run: ./gradlew assembleDebug --stacktrace

  # 6. Upload the generated APK so you can download it
  - name: Upload Debug APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: app-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error

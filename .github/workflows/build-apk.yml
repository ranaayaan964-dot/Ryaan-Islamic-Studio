name: Build Debug APK

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'
      cache: gradle

  - name: Setup Gradle Environment
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.11.1'

  - name: Ensure Gradle Wrapper Exists
    run: |
      if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
        echo "Generating Gradle wrapper..."
        gradle wrapper --gradle-version 8.11.1 --distribution-type bin
      fi
      chmod +x gradlew

  - name: Build Debug APK
    run: ./gradlew assembleDebug -PGEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" -PGROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" --stacktrace --no-daemon

  - name: Upload Debug APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: Ryaan-Islamic-Studio-v1.1.0-debug
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
